name: 📖 Documentation Request
description: Ask for new documentation or an improvement to the BetterEconomy/DonutREP docs.
title: "[Docs]: "
labels: ["type: docs"]
body:
  - type: markdown
    attributes:
      value: |
        ### Need help with the documentation?
        Thank you for helping keep the documentation clear and complete!

  - type: input
    id: where
    attributes:
      label: Where is the problem?
      description: The file or page (for example README, where-to-edit.txt, commands.txt, a config file comment).
      placeholder: "e.g., where-to-edit.txt, the ranks.yml comments"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Documentation Description
      description: What is missing, out of date, or unclear?
      placeholder: "Describe what needs to be documented or improved..."
    validations:
      required: true

  - type: textarea
    id: suggested_changes
    attributes:
      label: Suggested Content / Changes
      description: A draft, an outline, or suggestions, if you have them.
    validations:
      required: false
