# Amethyst tools. {time} in lore is the remaining life; DURATION is in seconds.
# DRILL has Fortune (applied to ores only); DRILL_SILK has Silk Touch on everything. SHOVEL_SILK is the shovel with Silk Touch; HOE (and HOE_SILK, the Silk Touch one) breaks 9 blocks of leaves, hay, moss, sculk and the like.
AMETHYST-TOOLS:
  COUNTDOWN-UPDATE-TICKS: 20      # the time left on a tool (the {time} line of its lore) is counted down this often while it is in an inventory (0 = off)
  HELD-REFRESH-SECONDS: 0         # the tool you HOLD is refreshed when you switch slot / close or click in an inventory. Set N to also refresh it every N seconds (it dips and rises each time)
  EXCLUDED-WORLDS:
  - duels
  PARTICLES:
    ENABLED: true
    TYPE: BLOCK
    BLOCK-MATERIAL: AMETHYST_BLOCK
    COUNT: 16
    SPREAD: 0.4
    DUST: true                  # purple sparkle around every block an amethyst tool breaks (the block you mined too)
    DUST-COUNT: 14
    DUST-RED: 160
    DUST-GREEN: 60
    DUST-BLUE: 230
  SOUNDS:
    USE: minecraft:block.amethyst_block.hit|1.0|1.2
    EXPIRE: minecraft:entity.lightning_bolt.impact|0.5|2.0
    BREAK: minecraft:block.amethyst_block.break|1.0|0.8
    ACTIVATE: minecraft:block.amethyst_block.resonate|1.0|1.0
  SECURITY:
    REQUIRE-ITEM-ID: true
    BIND-TO-OWNER: false
    CLICK-COOLDOWN-MS: 250
    BLOCK-HOPPER-PICKUP: true
  DRILL:
    ENABLED: true        # false = this tool cannot be given, bought from a crate or used (copies players already hold stop working)
    AUCTIONABLE: true     # true = players may list it on the auction house (it still cannot be sold with /sell, in the sell menu or with the sell axe)
    MATERIAL: NETHERITE_PICKAXE
    NAME: '&#9A58B5&lamethyst drill'
    LORE:
    - '&#BDC3C7breaks &d9 blocks &7per strike'
    - '&#BDC3C7charged by amethyst energy'
    - ''
    - '&#9A58B5✦ self destruct'
    - '&#BDC3C7{time}'
    ENCHANTMENTS:
    - efficiency:5
    - unbreaking:3
    - fortune:3
    RADIUS: 1
    DISABLED-BLOCKS: &id001
    - DIRT
    - GRASS_BLOCK
    - COARSE_DIRT
    - ROOTED_DIRT
    - PODZOL
    - SAND
    - RED_SAND
    - GRAVEL
    - SPAWNER
    - BEDROCK
    - OBSIDIAN
    - CRYING_OBSIDIAN
    - END_PORTAL_FRAME
    - FARMLAND
    - SOUL_SAND
    - SOUL_SOIL
    DURATION: 86400
  DRILL_SILK:
    ENABLED: true        # false = this tool cannot be given, bought from a crate or used (copies players already hold stop working)
    AUCTIONABLE: true     # true = players may list it on the auction house (it still cannot be sold with /sell, in the sell menu or with the sell axe)
    MATERIAL: NETHERITE_PICKAXE
    NAME: '&#9A58B5&lamethyst drill &7(silk touch)'
    LORE:
    - '&#BDC3C7breaks &d9 blocks &7per strike'
    - '&#BDC3C7silk touch on all blocks'
    - ''
    - '&#9A58B5✦ self destruct'
    - '&#BDC3C7{time}'
    ENCHANTMENTS:
    - efficiency:5
    - unbreaking:3
    - silk_touch:1
    RADIUS: 1
    DISABLED-BLOCKS: *id001
    DURATION: 86400
  CHOPPER:
    ENABLED: true        # false = this tool cannot be given, bought from a crate or used (copies players already hold stop working)
    AUCTIONABLE: true     # true = players may list it on the auction house (it still cannot be sold with /sell, in the sell menu or with the sell axe)
    MATERIAL: NETHERITE_AXE
    NAME: '&#9A58B5&lamethyst tree chopper'
    LORE:
    - '&#BDC3C7fells whole trees &dat once'
    - '&#BDC3C7breaks the whole trunk'
    - ''
    - '&#9A58B5✦ self destruct'
    - '&#BDC3C7{time}'
    ENCHANTMENTS:
    - efficiency:10
    - unbreaking:3
    MAX-LOGS: 128
    AUTO-LOG-TAG: true             # true = every log, wood, stem and hyphae of the game counts (pale oak too), on top of LOG-BLOCKS
    LOG-BLOCKS:
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - CHERRY_LOG
    - MANGROVE_LOG
    - CRIMSON_STEM
    - WARPED_STEM
    - STRIPPED_OAK_LOG
    - STRIPPED_SPRUCE_LOG
    - STRIPPED_BIRCH_LOG
    - STRIPPED_JUNGLE_LOG
    - STRIPPED_ACACIA_LOG
    - STRIPPED_DARK_OAK_LOG
    - STRIPPED_CHERRY_LOG
    - STRIPPED_MANGROVE_LOG
    - STRIPPED_CRIMSON_STEM
    - STRIPPED_WARPED_STEM
    - PALE_OAK_LOG
    - STRIPPED_PALE_OAK_LOG
    DURATION: 86400
  SELL-AXE:
    ENABLED: true        # false = this tool cannot be given, bought from a crate or used (copies players already hold stop working)
    AUCTIONABLE: true     # true = players may list it on the auction house (it still cannot be sold with /sell, in the sell menu or with the sell axe)
