AMETHYST-MESSAGES:
  DISABLED-TOOL: '{prefix}&#BDC3C7this tool is turned off on this server.'
  GIVE-DISABLED: '{prefix}&#BDC3C7that tool is turned off (ENABLED: false in amethyst-tools.yml).'
  PREFIX: '&#9A58B5[amethyst] &r'
  EXPIRED: '{prefix}&#BDC3C7your &d{tool} &7has &cexpired &7and crumbled away!'
  EXCLUDED-WORLD: '{prefix}&#BDC3C7amethyst tools do not work in this world.'
  DRILL-BREAK: '{prefix}&#BDC3C7&damethyst drill &7broke &d{count} &7blocks.'
  CHOP-BREAK: '{prefix}&#BDC3C7&damethyst tree chopper &7chopped &d{count} &7logs.'
  SELL-HOE-SUCCESS: '{prefix}&#BDC3C7sold the crops you harvested for &a${amount}&7.'
  SELL-SUCCESS: '{prefix}&#BDC3C7sold all chest contents for &a${amount}&7.'
  SELL-EMPTY: '{prefix}&#BDC3C7that chest is empty or holds nothing sellable.'
  SELL-NO-CHEST: '{prefix}&#BDC3C7right-click a chest to use this.'
  BUCKET-DRAIN: '{prefix}&#BDC3C7drained &d{count} &7water blocks.'
  BUCKET-NO-WATER: '{prefix}&#BDC3C7there is no water close by.'
  BOOSTER-ACTIVATED: '{prefix}&#BDC3C7&dshard booster &7activated! &d{multiplier}x &7shards for &d{time}&7.'
  BOOSTER-ALREADY: '{prefix}&#BDC3C7a shard booster is already running!'
  WRONG-OWNER: '{prefix}&#BDC3C7this tool belongs to another player.'
  GIVE-SUCCESS: '{prefix}&#BDC3C7gave &d{type} &7to &d{player}&7.'
  GIVE-USAGE: '{prefix}&#BDC3C7usage: &d/amethysttool give <player> <type> [duration]'
  GIVE-INVALID-TYPE: '{prefix}&#BDC3C7invalid tool type. types: drill, drill_silk, chopper, sell_axe, shovel, shovel_silk, hoe, bucket, shard_booster'
  RELOAD-SUCCESS: '{prefix}&#BDC3C7settings reloaded.'

