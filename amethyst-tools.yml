    LORE:
    - '&#BDC3C7sells everything in a chest at once'
    - '&#BDC3C7right-click a chest'
    - ''
    - '&#9A58B5✦ self destruct'
    - '&#BDC3C7{time}'
    ENCHANTMENTS:
    - efficiency:5
    - unbreaking:3
    DURATION: 86400
  SHOVEL:
    ENABLED: true        # false = this tool cannot be given, bought from a crate or used (copies players already hold stop working)
    AUCTIONABLE: true     # true = players may list it on the auction house (it still cannot be sold with /sell, in the sell menu or with the sell axe)
    MATERIAL: NETHERITE_SHOVEL
    NAME: '&#9A58B5&lamethyst shovel'
    LORE:
    - '&#BDC3C7breaks &d9 blocks &7per strike'
    - '&#BDC3C7soft ground only'
    - ''
    - '&#9A58B5✦ self destruct'
    - '&#BDC3C7{time}'
    ENCHANTMENTS:
    - efficiency:5
    - unbreaking:3
    - fortune:3
    RADIUS: 1
    ALLOWED-BLOCKS:
    - DIRT
    - GRASS_BLOCK
    - COARSE_DIRT
    - PODZOL
    - ROOTED_DIRT
    - GRAVEL
    - SAND
    - RED_SAND
    - CLAY
    - SOUL_SAND
    - SOUL_SOIL
    - FARMLAND
    - DIRT_PATH
    - SNOW
    - SNOW_BLOCK
    - POWDER_SNOW
    - MUD
    DURATION: 86400
  SHOVEL_SILK:
    ENABLED: true        # false = this tool cannot be given, bought from a crate or used (copies players already hold stop working)
    AUCTIONABLE: true     # true = players may list it on the auction house (it still cannot be sold with /sell, in the sell menu or with the sell axe)
    MATERIAL: NETHERITE_SHOVEL
    NAME: '&#9A58B5&lamethyst shovel &7(silk touch)'
    LORE:
    - '&#BDC3C7breaks &d9 blocks &7per strike'
    - '&#BDC3C7silk touch on soft ground'
    - ''
    - '&#9A58B5✦ self destruct'
    - '&#BDC3C7{time}'
    ENCHANTMENTS:
    - efficiency:5
    - unbreaking:3
    - silk_touch:1
    RADIUS: 1
    ALLOWED-BLOCKS:
    - DIRT
    - GRASS_BLOCK
    - COARSE_DIRT
    - PODZOL
    - ROOTED_DIRT
    - GRAVEL
    - SAND
    - RED_SAND
    - CLAY
    - SOUL_SAND
    - SOUL_SOIL
    - FARMLAND
    - DIRT_PATH
    - SNOW
    - SNOW_BLOCK
    - POWDER_SNOW
    - MUD
    DURATION: 86400
  HOE:
    ENABLED: true        # false = this tool cannot be given, bought from a crate or used (copies players already hold stop working)
    AUCTIONABLE: true     # true = players may list it on the auction house (it still cannot be sold with /sell, in the sell menu or with the sell axe)
    MATERIAL: NETHERITE_HOE
    NAME: '&#9A58B5&lamethyst hoe'
    LORE:
    - '&#BDC3C7breaks &d9 blocks &7per strike'
    - '&#BDC3C7leaves, hay, moss and crops'
    - ''
    - '&#9A58B5✦ self destruct'
    - '&#BDC3C7{time}'
    ENCHANTMENTS:
    - efficiency:5
    - unbreaking:3
    - fortune:3
    RADIUS: 1
    BREAK-CROPS: true               # true = the hoe also breaks crops (wheat, carrots, potatoes, beetroots, nether wart, berries, cocoa, melons, pumpkins...)
    CROPS-ONLY-MATURE: true         # true = a crop that is still growing is left alone; only fully grown ones are harvested
    ALLOWED-BLOCKS:
    - OAK_LEAVES
    - SPRUCE_LEAVES
    - BIRCH_LEAVES
    - JUNGLE_LEAVES
    - ACACIA_LEAVES
    - DARK_OAK_LEAVES
    - MANGROVE_LEAVES
    - CHERRY_LEAVES
    - PALE_OAK_LEAVES
    - AZALEA_LEAVES
    - FLOWERING_AZALEA_LEAVES
    - NETHER_WART_BLOCK
    - WARPED_WART_BLOCK
    - HAY_BLOCK
    - DRIED_KELP_BLOCK
    - SHROOMLIGHT
    - MOSS_BLOCK
    - MOSS_CARPET
    - SCULK
    - SCULK_VEIN
    - SPONGE
    - WET_SPONGE
    - TARGET
    DURATION: 86400
  HOE_SILK:
    ENABLED: true        # false = this tool cannot be given, bought from a crate or used (copies players already hold stop working)
    AUCTIONABLE: true     # true = players may list it on the auction house (it still cannot be sold with /sell, in the sell menu or with the sell axe)
    MATERIAL: NETHERITE_HOE
    NAME: '&#9A58B5&lamethyst hoe &7(silk touch)'
    LORE:
