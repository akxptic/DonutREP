    - unbreaking:3
    - fortune:3
    RADIUS: 1
    SELL-CROPS: true                # true = the crops it breaks are sold at once (sell multiplier and sell progress apply, like /sellall); everything else it breaks drops as normal. The crops are the ones in BREAK-CROPS.
    BREAK-CROPS: true               # true = the hoe also breaks crops (wheat, carrots, potatoes, beetroots, nether wart, berries, cocoa, melons, pumpkins...)
    CROPS-ONLY-MATURE: true         # true = a crop that is still growing is left alone; only fully grown ones are harvested
    ALLOWED-BLOCKS:
