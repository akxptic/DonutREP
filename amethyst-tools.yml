    ENCHANTMENTS:
    - efficiency:5
    - unbreaking:3
    - silk_touch:1
    RADIUS: 1
    BREAK-CROPS: true               # true = the hoe also breaks crops (wheat, carrots, potatoes, beetroots, nether wart, berries, cocoa, melons, pumpkins...)
    CROPS-ONLY-MATURE: true         # true = a crop that is still growing is left alone; only fully grown ones are harvested
    ALLOWED-BLOCKS:
    - OAK_LEAVES
