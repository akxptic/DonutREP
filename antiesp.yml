# Anti-ESP: spawners and chests that are far from a player look like plain blocks to that player, so an ESP / x-ray client cannot show where they are.
# Inside `radius` blocks of a spawner or chest the player sees the real block. Farther away it looks like the block for its height:
#   below deepslate-below-y  -> deepslate;   below stone-below-y -> stone;   everywhere else (and in the Nether / End) -> a crafting table.
# With the packetevents plugin installed the chunk data is rewritten before it is sent (a cheat client never sees the real block). Without it, plain block changes are
# sent right after the chunk (weaker). Only players with the permission donutrep.bypass.antiesp see the real blocks (ops do NOT, unless ops-bypass is true). Edit freely, then /donutrep reload.
antiesp:
  enabled: true
  packets: true                 # true = rewrite the chunk packets when packetevents is installed; false = plain block changes only
  spawners:
    enabled: true
    radius: 24                  # blocks (a sphere around the player)
  chests:
    enabled: true
    radius: 24
    types: [CHEST, TRAPPED_CHEST, BARREL, ENDER_CHEST]     # which blocks count as chests
  disguise:
    deepslate-below-y: 0        # below this height the block looks like deepslate
    stone-below-y: 60           # from there up to this height it looks like stone
    above-block: CRAFTING_TABLE # anywhere else (higher up, or another world type)
  ops-bypass: false             # true = operators see the real blocks too (so they cannot test it); false = only players with donutrep.bypass.antiesp
  excluded-worlds: []           # worlds where nothing is hidden
  check-ticks: 10               # how often the distance of each player is checked (20 ticks = 1 second)
  max-chunks: 12                # at most this many chunks around a player are checked (their view distance, capped here)
  rescan-seconds: 5             # how often the chunks around players are searched again for new spawners / chests (0 = only when a chunk loads or a player places one)

