# Lunar Client integration (needs the Apollo plugin; only players on Lunar Client are affected).
apollo:
  enabled: true
  team-max-size: 10                  # shown as the team's maximum size in rich presence
  # Your team mates show up in Lunar Client's team view (coloured markers with their position).
  team-view:
    enabled: true
    update-ticks: 20
  # Discord rich presence set by the server. Placeholders: {player} {money} {team_size} {team_max_size} {world}
  rich-presence:
    enabled: false
    update-seconds: 1
    player-state: Playing
    game-state: Playing
    game-name: Economy
    variant: '{player} (${money})'
    world-name: Economy
    sub-server-name: SMP
    max-field-length: 128

