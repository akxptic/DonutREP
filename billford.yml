# Bilford: one trade is open at a time, and the open trade changes on a timer.
# The list of trades is at the bottom of this file. Reload with /donutrep reload.

# ============================================================
# Trade rotation
# ============================================================

# The trade that is open on a fresh install (1 = the first trade below).
# After the first start the current trade is kept in billford-data.yml.
CURRENT: 1

# How the next trade is picked:
# SEQUENTIAL -> 1 -> 2 -> 3 -> 4 -> 1 ...
# RANDOM     -> any trade, but never the same one twice in a row
ROTATION_MODE: SEQUENTIAL

# When the trade changes. Days and hours are added together (2 days + 12 hours is fine).
COUNTDOWN:
  ENABLED: true
  # SYSTEM = the time zone of the machine. A real zone such as "UTC" or "Europe/Berlin" works too.
  TIME_ZONE: SYSTEM
  START_DATE: "2026-10-01 12:00:00"
  INTERVAL_DAYS: 3
  INTERVAL_HOURS: 0

# Tell everybody when the trade changes. {countdown} = time until the next change.
ANNOUNCE_ON_ROTATE: true
ANNOUNCE_MESSAGE: "&6[Bilford] &fA new deal is open. &7Next change in &b{countdown}&7."

# Who may open the trade menu, and how.
ACCESS:
  # Empty = everybody.
  PERMISSION: ""
  COMMAND: "/billford"
  NPC:
    ENABLED: false
    DISPLAY_NAME: "&aBilford"
    INTERACT_COMMAND: "/billford"

SETTINGS:
  CLICK_COOLDOWN_MS: 800
  CLOSE_MENU_ON_SUCCESS: true
  REOPEN_ON_TRADE_CHANGE: true
  ALLOWED_CLICK_TYPES:
    - LEFT
    - RIGHT

# ============================================================
# The menu
# ============================================================
GUI:
  TITLE: "&8Bilford's Trades"
  SIZE: 54
  FILLER_MATERIAL: GRAY_STAINED_GLASS_PANE
  REWARD_SLOT: 25
  COUNTDOWN_SLOT: 32             # the clock (one slot to the right of before)
  INFO_SLOT: 49
  CONFIRM_SLOT: 23              # the confirm button (one slot to the right of before)
  INFO_MATERIAL: BOOK

  INPUT_NAME: "&f{item}"
  INPUT_LORE:
    - "&7You give: &f{amount}x &e{item}"
    - ""
    - "&8Have it in your inventory first."

  REWARD_NAME: "&aYou get"
  REWARD_LORE:
    - "&7Item: &a{amount}x &f{item}"
    - "{money_line}"
    - "{shard_line}"
    - ""
    - "&8Handed over when the trade goes through."

  COUNTDOWN_NAME: "&e{trade_name}"
  COUNTDOWN_LORE:
    - "&7Changes in: &b{countdown}"
    - ""
    - "&8Trade &f{trade_id} &8of &f{trade_count}"

  INFO_NAME: "&6About this trade"
  INFO_LIMITED_LORE:
    - "&7Trades made: &f{used} &7/ &f{limit}"
    - "{status_line}"
  INFO_UNLIMITED_LORE:
    - "&7Trades made: &f{used}"
    - "&aNo limit on this deal."

  CONFIRM_BUTTON:
    MATERIAL: LIME_DYE
    NAME: "&a&lMake the trade"
    LORE:
      - "&7Put the items in your inventory,"
      - "&7then click to swap them."
      - ""
      - "&a&lClick to trade"

  LIMIT_BUTTON:
    MATERIAL: BARRIER
    NAME: "&c&lAll used up"
    LORE:
      - "&cYou have made this deal as often"
      - "&cas allowed for now."
      - "&7Come back when the trade changes."

FEEDBACK:
  SUCCESS_PARTICLE:
    ENABLED: true
    TYPE: HAPPY_VILLAGER
    COUNT: 18

# ============================================================
# Bonuses (optional)
# Every trade can also pay shards and/or money on top of the item. They are OFF by default: the items alone make each deal fair.
# Turn a kind on here and the SHARD_BONUS / MONEY_BONUS written in the trades below are paid and shown in the reward lore.
# A few trades carry an example value; add or change them as you like (/donutrep reload). With a switch off, the numbers are ignored.
# ============================================================
BONUSES:
  MONEY_ENABLED: false
  SHARD_ENABLED: false

# ============================================================
# The trades (24, one after the other; each one is open for the COUNTDOWN interval above)
# INPUTS: 1-9 items the player gives, shown as a 3x3 block: slots 10 11 12 / 19 20 21 / 28 29 30 (input 1 = 10, input 2 = 11, input 3 = 12, input 4 = 19 ...).
#   SLOT counts from 1 and may be any slot of the menu, but keep to the 3x3 block above so the loot you need always looks the same.
# LIMIT: how often one player can make the deal per rotation (0 = no limit).
# REWARD: MATERIAL + QUANTITY (up to 64). Balance: what you get is worth 110-140% of what you give (a little more than you hand in) (sell prices of worth.yml) - check with /worth when you change an item.
# ============================================================
