# The SQLite databases live in plugins/DonutREP/data/ (.db, .db-shm, .db-wal). You never need to edit them.
# This file controls the automatic backups: backups/config (your yml files) and backups/data (databases + data files).

# Backups: backups/config gets a snapshot of every .yml you edit (when it changed), backups/data one of the databases and data files.
backups:
  keep-config: 15
  keep-data: 12
  data-interval-minutes: 360     # 0 = only when the server starts and stops

