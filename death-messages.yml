# Custom death messages. Players who turn Death Messages off in /settings do not see them.
# Placeholders: {player} {killer} {item}. Cause names are Bukkit damage causes.
death-messages:
  enabled: true
  prefix: '&c☠ &7'
  messages:
    KILLED_BY_PLAYER: '{player} was slain by {killer} using {item}'
    ENTITY_ATTACK: '{player} was slain by {killer}'
    PROJECTILE: '{player} was shot by {killer}'
    BLOCK_EXPLOSION: '{player} was blown to pieces'
    ENTITY_EXPLOSION: '{player} was blown up'
    CONTACT: '{player} was pricked to death'
    CRAMMING: '{player} was squished too much'
    DROWNING: '{player} drowned'
    FALL: '{player} hit the ground too hard'
    FALLING_BLOCK: '{player} was squashed by a falling block'
    FIRE: '{player} went up in flames'
    FIRE_TICK: '{player} burned to death'
    FLY_INTO_WALL: '{player} experienced kinetic energy'
    FREEZE: '{player} froze to death'
    HOT_FLOOR: '{player} discovered the floor was lava'
    LAVA: '{player} tried to swim in lava'
    LIGHTNING: '{player} was struck by lightning'
    MAGIC: '{player} was killed by magic'
    POISON: '{player} was poisoned'
    STARVATION: '{player} starved to death'
    SUFFOCATION: '{player} suffocated in a wall'
    SUICIDE: '{player} took their own life'
    THORNS: '{player} was killed trying to hurt {killer}'
    VOID: '{player} fell out of the world'
    WITHER: '{player} withered away'
    DEFAULT: '{player} died'

