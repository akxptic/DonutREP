# Punishments (/ban, /tempban, /mute, /tempmute, /warn, /kick, /blacklist, /punish): who got punished, the type, the reason, who did it.
discord:
  # Player Report Notification: every /report is posted here (who, why, where). Blank url = off.
  report:
    enabled: true
    webhook-url: ''
    username: 'Player Report Notification'
    title: 'Player Report Notification'
    thumbnail: true
  # Team chat: every team message is posted here (batched every few seconds). Blank url = off.
  teamchat:
    enabled: true
    webhook-url: ''
    username: 'Team Chat'
    title: 'Team Chat'
    batch-seconds: 10
  # Alt alert: a webhook message when a player has MORE accounts than max-accounts (the accounts that logged in from the same IP address as theirs, /alts shows them).
  alt-alert:
    enabled: true                 # nothing is sent until webhook-url is filled in
    webhook-url: ''
    username: 'Alt Watch'
    max-accounts: 5               # alert when a player has more than this many accounts (this number counts the player's own account too)
    repeat-hours: 24              # the same player is reported again after this many hours (0 = at every join)
    show-ip: false                # true = the IP address is in the message (leave it off if the channel is not private)
    thumbnail: true               # the player's head render on the side of the message
  # New players: a message when somebody joins for the first time (and after they played a few minutes). Blank url = off.
  newplayer:
    enabled: true                 # nothing is sent until webhook-url is filled in
    webhook-url: ''
    username: 'New Players'
    after-minutes: 10             # a second message when they have played this long (0 = only the first)
    show-alts: true               # how many other accounts share their IP address (and the first names)
    thumbnail: true               # the player's head render on the side of the message
  # Pregenerator (/pregen): a message for every every-percent percent a world has done, when one starts, finishes or is paused. Blank url = off.
  pregen:
    enabled: true                 # nothing is sent until webhook-url is filled in
    webhook-url: ''
    username: 'Pregenerator'
    every-percent: 10             # a message at 10%, 20% ... (0 = no progress messages)
    on-start: true
    on-finish: true
  punishments:
    enabled: true                 # nothing is sent until webhook-url is filled in
    webhook-url: ''
    username: 'Moderation System'
    types: [BAN, MUTE, WARN, KICK, BLACKLIST, STATSWIPE]
    show-counts: true             # how many warnings / bans (...) the player has had, and their total
    thumbnail: true               # the player's head render on the side of the message

