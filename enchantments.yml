# Enchantment rules, enforced at the anvil and the enchanting table. Players with donutrep.bypass.enchantlimit are exempt.
enchantments:
  enabled: false
  # highest level allowed per enchantment (lower than the vanilla maximum to cap it). Leave one out to keep the vanilla maximum.
  max-levels:
    sharpness: 5
    protection: 4
    fire_protection: 4
    blast_protection: 4
    projectile_protection: 4
    unbreaking: 3
    efficiency: 5
    fortune: 3
    looting: 3
    power: 5
    punch: 2
    knockback: 2
    fire_aspect: 2
    thorns: 3
    feather_falling: 4
  # enchantments that cannot be put on items at all (for example: [mending, thorns])
  banned: []
  message: '&cThat enchantment is not allowed here and was removed.'

