# /freeze: what a frozen player can still do, the reminder they see, and what happens if they log out. (The movement lock itself is built in.)
freeze:
  block-commands: true
  allowed-commands: [msg, r, reply, tell, w, helpop, report, discord]     # commands a frozen player may still use
  block-world-actions: true          # no breaking, placing or interacting while frozen
  block-item-actions: true           # no dropping or picking up items while frozen
  invulnerable: false                # true = frozen players take no damage
  alert-interval-ticks: 100          # how often the reminder is shown
  actionbar: '&c&lYou are frozen! &7Do not log out - follow staff instructions.'
  quit:
    notify-staff: true               # staff with donutrep.staff.freeze see it when a frozen player logs out
    commands: []                     # run when a frozen player logs out, for example: ['ban %player% Logged out while frozen']
  messages:
    command-blocked: '&cYou can''t use commands while frozen.'
    quit-alert: '&c{player} logged out while frozen!'

