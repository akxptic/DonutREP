# Every floating text of the plugin is set here. Edit, save, then run /donutrep reload (a text that already exists is updated; a new size or height applies at once).
# Colors: & codes and &#rrggbb. A line break inside a text is \n.

# The text above every rtp-zone cuboid (/cuboid bind <cuboid> rtp-zone true). One zone's height: /cuboid hologram <cuboid> height <blocks>
rtp-zone:
  enabled: true
  height: 2.0                 # blocks above the top of the zone
  scale: 1.0                  # size of the text (1.0 = normal, 2.0 = twice as big)
  text: '&c&lRTP ZONE'
  countdown-text: '&fTeleporting in &e{time}s'
  idle-text: '&7Step inside to start &8({time}s)'
  teleport-text: '&a&lTeleporting!'

# Leaderboard holograms: /hologram create <kills|deaths|balance|playtime|shards|duels|ffa> [id] puts one where you stand.
# /hologram list, remove <id>, move <id>, scale <id> <size|default>, reload.   Admin permission: donutrep.admin.hologram
leaderboards:
  enabled: true
  update-seconds: 120         # how often the lists are worked out again (kills, deaths and playtime read every player's stats: do not set this very low on a big server)
  background: false           # true = the dark box behind the text
  see-through: false          # true = the text can be read through blocks AND through water (with false, ocean water in front of the text hides it - the game draws water over it)
  types:
    kills:
      title: '&c&lTOP KILLS'
      line: '&e#{rank} &f{player} &7- &c{value}'
      empty-line: '&7#{rank} &8-'
      entries: 10
      scale: 1.0
    deaths:
      title: '&4&lTOP DEATHS'
      line: '&e#{rank} &f{player} &7- &4{value}'
      empty-line: '&7#{rank} &8-'
      entries: 10
      scale: 1.0
    balance:
      title: '&a&lTOP BALANCE'
      line: '&e#{rank} &f{player} &7- &a{value}'
      empty-line: '&7#{rank} &8-'
      entries: 10
      scale: 1.0
    playtime:
      title: '&b&lTOP PLAYTIME'
      line: '&e#{rank} &f{player} &7- &b{value}'
      empty-line: '&7#{rank} &8-'
      entries: 10
      scale: 1.0
    shards:
      title: '&d&lTOP SHARDS'
      line: '&e#{rank} &f{player} &7- &d{value}'
      empty-line: '&7#{rank} &8-'
      entries: 10
      scale: 1.0
    duels:                      # most duels played - shows wins, losses and the win/loss ratio. Placeholders: {games} {wins} {losses} {ratio}
      title: '&6&lMOST DUELS'
      line: '&e#{rank} &f{player} &7- &f{games} &7duels &8| &a{wins}W &c{losses}L &8| &e{ratio} W/L'
      empty-line: '&7#{rank} &8-'
      entries: 10
      scale: 1.0
    ffa:                        # most FFA games - an FFA kill counts as a win, a death as a loss
      title: '&6&lMOST FFA'
      line: '&e#{rank} &f{player} &7- &f{games} &7games &8| &a{wins}W &c{losses}L &8| &e{ratio} W/L'
      empty-line: '&7#{rank} &8-'
      entries: 10
      scale: 1.0

