# /invsee: the live inventory viewer for staff.
invsee:
  enabled: true
  title: '&8inventory of {player}'     # window title ({player} = whose inventory it is); blank = leave the default
  allow-edit: true                     # false = staff can look but not move or take items
  allow-self-view: false               # false = /invsee on yourself is refused
  notify-target: false                 # true = the player is told when someone opens their inventory
  log-usage: true                      # write who looked at whose inventory to the console
  messages:
    self: '&cYou can''t view your own inventory this way.'
    notify: '&7A staff member is viewing your inventory.'

