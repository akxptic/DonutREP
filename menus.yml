# Menus: change a title, the panes of a menu (filler), or a button (slot number -> name / material / lore / hide: true).
# A menu is found by its id (the title without colours and numbers). Only what is written here changes; the rest stays as built in.
# /donutrep menus  lists the menus   /donutrep menus export <id|all>  writes the menus you have opened to menus-export.yml
# Remove an entry to get the built-in menu back. /donutrep reload applies changes.
# Buttons whose text changes (numbers, money, player names) are not listed; menus that are opened with a different title
# every time (crate names, player names) are not listed either.
# Example:  auction-house:
#             title: '&8Market'
#             filler: GRAY_STAINED_GLASS_PANE
#             buttons:
#               49: { name: '&aRefresh', material: EMERALD }
#               53: { hide: true }
