# /orders settings.
orders:
  max-active-default: 5          # active orders per player without a limit permission (donutrep.orders.limit.<n>)
  max-quantity-per-order: 2304   # most items one order can ask for
  allow-enchant-orders: true     # true = when ordering an item that can be enchanted, the buyer can choose which enchantments it must have
  new-menus: true               # true = the Your Orders / Edit Order / Cancel Order windows and the dialog window to choose the item;  false = the original menus (everything else works the same)
  expire-days: 7                # an order that still waits for items takes no more deliveries after this many days (it stays: its owner can collect and cancel it). 0 = never
  delete-days: 90               # an order that is not fully claimed after this many days is deleted: the part nobody delivered is refunded, delivered items nobody collected go with it. 0 = never. Only counts once the order expired (orders from before this setting existed are counted from the day it came)

