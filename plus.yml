# Anti-dupe + anti-cheat flags shown in /sus. A dupe is flagged when the same stamped item id is found twice online.
sus:
  anti-cheat: true
  max-blocks-per-second: 12.0
  max-reach-distance: 6.0
  knockback-grace-seconds: 3.0
  ore-window: 200
  ore-threshold: 0.35
  ore-minimum: 8
  alert-cooldown-seconds: 30
  alert-permission: donutrep.staff.sus
  dupe-detection: true
  dupe-scan-seconds: 5

enderchest-off-message: '&cEnder chests are turned off on this server.'   # shown when somebody tries to open one while features.enderchest is false

# /safety opens the safety guide as a book to read - no item. give-book: true gives the book item again (it can be sold). /safety give <player> always gives it.
safety:
  give-book: false

# Player reports (/report <player> <reason>): saved, shown to staff with buttons, sent to Discord (discord.yml -> discord: report:). Admins read them with /reports.
reports:
  enabled: true
  cooldown-seconds: 60
  min-reason-length: 3
  keep-days: 30
  notify-staff: true

# /pmo (aliases /playmode, /adminmode): an admin plays like a normal player. Every admin command of this plugin (punishments and /statswipe too) is refused and gone from
# the tab list, the donutrep.bypass.* permissions are off, and it stays on after a relog. The admin stays op, so a command of ANOTHER plugin has to be listed in also-hide.
playmode:
  enabled: true
  also-hide: [gamemode, give, tp, teleport, op, deop, effect, enchant, time, weather, kill, summon, clear, xp, difficulty, setblock, fill, clone, execute, data, tellraw, title, gamerule]
  keep: []                       # DonutREP commands that stay usable in play mode
  turn-off: { vanish: true, staff-mode: true, fly: true, god: true }       # what is switched off when play mode turns on
  message-on: '&aPlay mode is ON. &7You play like a normal player: admin commands and bypasses are off. Type &f/pmo&7 again to switch back.'
  message-off: '&eAdmin mode is back. &7Your commands work again.'
  message-join: '&7Play mode is still &aON&7. Type &f/pmo&7 for admin mode.'
  blocked-message: "&cPlay mode is on, so you can't use that. Type &f/pmo &cto go back to admin mode."

# /punish <player> (without an offense) opens a menu: Light Ban, Ban, Stat Wipe, Loot Wipe (+ the old list of preset offenses), then a reason, then confirm.
# Each button runs the normal command (/lightban, /ban, /statswipe) so permissions, history and the Discord webhook are the same. Loot Wipe has its own node: donutrep.staff.punishments.lootwipe.
punish-menu:
  enabled: true              # false = /punish <player> shows the old list of preset offenses
  custom-reason: true        # the "Custom reason" button (the staff member types it in chat)
  actions: { lightban: true, ban: true, statswipe: true, lootwipe: true, preset: true }       # which buttons are shown
  reasons:                   # the ready-made reasons (up to 27)
    - 'Hacking / cheating'
    - 'X-ray'
    - 'Duping / exploiting a bug'
    - 'Griefing'
    - 'Ban evasion / alt account'
    - 'Harassment / toxicity'
    - 'Advertising'
    - 'Spamming'
    - 'Scamming'
    - 'Inappropriate name or skin'
    - 'Breaking the server rules'

# The [ACCEPT] [DENY] buttons you can click instead of typing, for each kind of request. false = no buttons of that kind for anybody.
# Every player also has "Click Buttons" in /settings (page 2): off = no buttons for them at all, on = buttons for the kinds that are true here.
# (If all four are false the option is not shown in /settings.) The commands in the message always work.
click-buttons:
  tpa: true        # /tpa and /tpahere requests
  tphere: true     # /tphere (the same as /tpahere); false = /tphere is off, /tpahere still works
  duel: true       # duel challenges
  team: true       # team invitations
  friend: true     # friend requests

# /pvptop: the PvP leaderboard menu (button = FFA / duels). enabled false = the command says it is off.
pvptop:
  enabled: true
  default: ffa          # which board opens first: ffa | duels
  size: 45              # how many players are listed (up to 45)

# A text above every portal (/portaladmin menu -> click a portal -> Change the hologram text). {warp} = where it leads. | in a typed text = a new line.
portal-hologram:
  enabled: true
  height: 0.8
  scale: 1.0
  default-lines: ['&5&lPortal', '&7Walk in to travel to &f{warp}']

# The activity log (logs/activity-log.txt): what each player typed, ran, and when they joined, left or died - the menus of /logs <player> and /chatlog read it. OFF by default:
# nothing is recorded and /logs and /chatlog show the plain chat list from logs/chat-log.txt instead. An existing activity-log.txt is left in the logs folder (delete it if you do not need it).
activity-log:
  enabled: false

# logs/chat-log.txt (/chatlog): lines older than keep-days are deleted (when the server starts and once an hour). prune: false = keep everything.
chatlog:
  prune: true
  keep-days: 7

# /chat with no arguments opens the chat management menu (mute, delay, clear) for players who may use /chat. false = the old text help.
chatmenu:
  enabled: true

# /keyhistory (admin): every change of a player's crate keys is written to logs/key-history.log (who, how many, the new balance, the cause).
keyhistory:
  enabled: true        # false = nothing is recorded and /keyhistory says so
  keep-days: 90        # older lines are dropped when the server starts

# DonutREP's own anti-cheat (/anticheat: panel, alerts, status). Alert-only unless punish.enabled is true. A failed check adds violation points (vl) that fade
# (decay-per-second); staff with donutrep.ac.alerts see "[AC] Name failed Reach (A) (5)" once a check's alert-vl is reached, and every flag is in /sus.
# Players with donutrep.bypass.ac are never checked; creative / spectator, frozen players and a high ping or low TPS (max-ping, min-tps) are skipped.
# Each check can be switched off here (enabled: false) or with a click in /anticheat. Numbers can be tuned per check.
anticheat:
  enabled: true
  decay-per-second: 0.05          # 1 point fades in 20 seconds
  alert-cooldown-seconds: 2.0     # the same check for the same player alerts at most this often
  max-ping: 350                   # above this ping a player is not judged
  min-tps: 17.0                   # below this server TPS nobody is judged
  skip-checks-grim-covers: false  # true = with GrimAC installed, the checks listed in grim-covers are not run here (Grim already does them)
  grim-covers: [reach, hitbox, killaura, autoclick, fly-hover, fly-rise, speed]
  punish:
    enabled: false                # true = run the commands below once a check reaches vl (never for a first flag)
    vl: 25
    commands:
      - 'kick {player} Unfair advantage ({check})'
  checks:
    reach:       { enabled: true, leeway: 0.6, alert-vl: 1 }              # reach of the player (3.0 normal) + leeway + ping
    hitbox:      { enabled: true, tolerance: 0.4, alert-vl: 3 }           # how far outside the target's box the look direction may pass
    killaura:    { enabled: true, targets: 3, window-ms: 500, alert-vl: 2 }
    autoclick:   { enabled: true, max-cps: 22, alert-vl: 2 }
    fly-hover:   { enabled: true, hover-ticks: 25, alert-vl: 1 }
    fly-rise:    { enabled: true, max-jump: 1.35, alert-vl: 1 }           # blocks above the last ground (jump boost adds 0.5 per level)
    speed:       { enabled: true, max-bps: 9.0, alert-vl: 1 }             # blocks per second without effects; speed effects and ice scale it
    fastbreak:   { enabled: true, factor: 0.6, alert-vl: 2 }              # 0.6 = broken in less than 60 percent of the survival time
    autototem:   { enabled: true, min-ms: 100, alert-vl: 2 }
    crystalaura: { enabled: true, max-ticks: 1, count: 3, alert-vl: 1 }
    anchoraura:  { enabled: true, min-ms: 60, alert-vl: 2 }

# /rtpq: the players of one match (rtp-rules.queue.min-players of them) land in the same area, at most this many blocks apart.
rtpq:
  spread-radius: 16

# Voice chat: when true (and the voicechat plugin is installed) players cannot speak until they accept /vcconsent.
voicechat:
  require-consent: true

# Cuboid bindings (/cuboid bind <cuboid> <spawn|afk|shard|rtp-zone> true).
zones:
  shard:
    interval-seconds: 60      # one reward every this many seconds spent inside a shard cuboid
    amount: 1
    recent-movement-seconds: 0    # 0 = sitting idle earns; set e.g. 15 to require recent movement
    reset-on-leave: true
  rtp:
    countdown-seconds: 30     # every rtp-zone cuboid has its own countdown: everybody inside the same zone sees the same time
    continuous: false         # false = a zone with nobody inside stops and goes back to the full time; the countdown starts when somebody steps in. true = it never stops
    same-spot: true           # true = everybody inside a zone is sent to the SAME coordinates; each zone gets its own spot, never inside an rtp zone. false = everybody gets a spot of their own
    world: ''                 # blank = the player's current world
    # the text floating above every rtp zone is set in hologram.yml (rtp-zone:)

# Money shown next to other players' names (each player can turn it off in /settings).
nametags:
  money-default: true

# Per-player limits come from permissions (the highest number a player has wins), for example:
#   lp group default permission set donutrep.homes.20 true
#   lp group default permission set donutrep.auctionhouse.16 true
#   lp group default permission set donutrep.orders.limit.5 true
# Without any of those, these defaults apply.
# Weekly cleanup of the small temporary notes the plugin keeps in memory (a server restart clears them too). Nothing a player earned is touched: money, homes, levels,
# keys, ranks and stats are saved elsewhere. Chat-filter offense counts are never cleared. A Discord webhook is told on the warn day, a few minutes before, and when done.
maintenance:
  weekly-cleanup:
    enabled: false                 # OFF by default. true = switch the weekly cleanup on
    day: SUNDAY                    # the day the cleanup runs
    time: "18:00"                  # at this time (server time, 24 hours)
    warn-day: SATURDAY             # the day the first warning goes out
    warn-time: "18:00"
    final-warning-minutes: 10      # a second warning this many minutes before the cleanup
    announce-done: true            # a message when it is finished (with the number of records removed)
    discord-webhook: ''            # Discord: channel settings > Integrations > Webhooks. Blank = no Discord messages
    clear:                         # true = this kind of note is cleared, false = kept
      amethyst-click-cooldowns: true
      spawner-bait-alert-times: true
      sus-alert-cooldowns: true
      crate-open-times: true
      rank-menu-state: true
      spawn-reasons: true
      ecowatch-baseline: false     # the balance /ecowatch compares with; cleared = the next check starts a new comparison
      sus-flags: false             # the flags /sus shows staff (evidence) - keep false unless you want them gone each week

# Hover stats: hover a player's name to see their money, kills, deaths, playtime and shards; click to open /stats <name>. Each place has its own switch.
hover-stats:
  chat: true            # the name in the chat
  tpa: true             # the /tpa request message
  tpahere: true         # the /tpahere request message
  duel: true            # the duel challenge message

# /tpa and /tpahere requests
tpa:
  clickable: true       # a /tpa, /tpahere or duel request ends with clickable [ACCEPT] [DENY] buttons (like a team invitation)
  show-world: false     # true = the request says which world the sender is in (e.g. "wants to teleport to you (Nether)")

limits:
  defaults:
    homes: 3
    auction: 5
    orders: 5

