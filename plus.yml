# Sell progression: every level (money earned from selling a category) raises that category's multiplier by `step`.
sellprogress:
  step: 0.05
  levels: [25000, 150000, 500000, 1000000, 5000000, 25000000, 250000000, 550000000, 850000000, 1000000000, 2000000000, 4000000000, 8000000000, 10000000000, 20000000000, 40000000000, 80000000000, 160000000000, 320000000000, 640000000000]

# Crate keys are a stored balance (no key items).
crates:
  open-mode: CHOOSE      # CHOOSE = right-click a bound crate with a key and pick the reward you want; RANDOM = random reward
  show-chance: false     # true = the reward lore in the preview says "Chance: 12.50%" (only useful in RANDOM mode; the crate editor for admins always shows it)
  show-weight: false     # true = the chance line also says "(weight 25)" (needs show-chance)
  # menu-size: 27 (default) or 54: every reward sits in the slot the admin put it in. 27 = one 27-slot menu for the crate, its editor and the preview (with a key, clicking a reward asks you to confirm).
  # 54 = the top 45 slots hold the rewards and the bottom row holds the buttons (Back, key, Random, Close, Edit); a click on a reward claims it. Select an item in your inventory, click an empty slot to put it
  # there; shift-left-click a reward then an empty slot (or another reward) to move / swap it; shift-right-click = crate settings. A crate with more rewards than fit opens the classic 54-slot menu.
  # "classic" (or the old crates.small-menus: false) = the old 54-slot menus where the rewards are laid out by menu-layout / menu-slots below.
  menu-size: 27
  menu-filler: true      # gray glass panes in the slots that hold no reward (false = empty slots)
  key-required-to-preview: false   # false (default) = a player can click a bound crate and see its rewards without a key. true = no key, no look inside (they are only told they need a key)
  preview-item: true     # the reward item that floats and turns above a bound crate and changes to the next reward (false = only the text tag)
  preview-cycle-ticks: 100   # ticks (20 = 1 second) between one reward and the next: 100 = 5 seconds, 200 = 10 seconds
  preview-spin: true     # the floating item turns slowly
  random-button: false   # true = a "Random reward" button under the rewards of the choose menu: the crate picks (by weight) and plays the spin
  spin-animation: true   # the rolling menu (red panes = not this one, the green pane pair = your reward) for random opens; false = the reward at once
  auto-shop: false       # true = creating a crate (/crates, /crate create) also puts its key in /shop -> Crate keys at the price below; deleting the crate takes it out
  auto-shop-currency: SHARD   # SHARD or MONEY
  auto-shop-price: 1000       # (the key can always be added, changed or removed by hand: crate editor -> "Add key to shop")
  ask-color-on-create: true   # true = after /crate create the colour menu opens for the admin (colour of the crate's name: 24 ready-made colours, a hex code typed in chat, or a gradient); closing it keeps the crate white. Also: /crate color <id> and the crate editor's Crate Color button
  color-dialogs: false        # true = the colour choice is a dialog window (Paper 1.21.7 and newer); false = chest menu
  spin-ticks-start: 2    # how fast the roll starts (ticks per step) ...
  spin-ticks-end: 10     # ... and how slow it ends
  menu-layout: CENTER    # where the rewards sit in the 'choose a reward' menu and the rewards preview: TOP (top left, rows from slot 0), CENTER (middle of the menu) or BOTTOM (just above the key/close bar)
  # The floating tag above a crate: every player sees their own key count. {crate} = the crate name, {keys} = the viewer's keys for it.
  floating-tag: true     # false = only the original one-line crate name
  tag-lines:
    - '{crate}'
    - '&7Right-click to open'
    - '&7Keys: &e{keys}'
  tag-range: 24          # blocks: the tag is shown to players this close
  menu-slots: []         # or put every reward exactly where you want: a list of slots 0-44 (left to right, top to bottom), for example [10, 12, 14, 16, 28, 30, 32, 34]. Used in order; empty = use menu-layout

# "X is now AFK" / "X is no longer AFK" broadcast to everyone.
afk:
  announce: false

# No cents anywhere: prices, pay, balances and sells are whole dollars.
economy:
  whole-numbers: true

# Worth on hover: hovering an item in your inventory or a chest adds these lines to its tooltip (needs the packetevents plugin).
# Tokens: {worth} price each, {total} price of the whole stack, {amount}, {category}. Each player can turn it off with Worth Display in /settings.
worth-display:
  enabled: true
  shulker-contents: true     # a shulker box shows the worth of everything inside it (true/false)
  lines:
    - '&7Worth: &a${worth}'
    - '&7Stack of {amount}: &a${total}'      # only shown when you hold more than one
    - '&8{category}'

# PvP is switched off inside every cuboid (set false to only protect cuboids bound to spawn).
cuboid:
  pvp-disabled: true


# /leaderboard (menu): team leaderboard entry
leaderboard:
  teams: true

# /ban (permanent) wipes the player's items - inventory, armour, off hand and ender chests. /lightban and /tempban never do.
punishments:
  ban-wipes-items: true
  wipe-auctions-orders: true          # a permanent ban or a Loot Wipe also deletes everything the player has on /ah (the items are gone) and all their orders (no refund). false = those stay
  # IP bans (/banip <player|ip> [time] [reason], /unbanip, /ipbans): a banned address cannot join with any account.
  ip-ban-also-bans-account: true      # /banip <player> also bans that account (so /punishments shows it); /unbanip <player> lifts both
  ip-ban-allow-local: false           # false = 127.0.0.1 / ::1 cannot be banned (that would lock out everybody on the server machine)
  ip-ban-message: "&c&lYour IP address is banned!\n&8&m----------------------------\n&7Reason: &f{reason}\n&7Expires: &f{exp}\n&8&m----------------------------"

# Items with a custom name, or that went through an anvil, cannot be sold in /sell, with the sell axe or on /ah.
sell-protection:
  block-modified-items: true

# /settings alert switches (Pay Alerts, Auction Alerts, Order Alerts): chat lines matching these patterns (plain text, regex)
# are not shown to players who turned the switch off. Change a pattern if you reword the original messages.
# Totem Particles (/settings): off = the totem pop (particles, sound and the totem flash) is not shown. hide-own: false = you still see your own totem pop.
totem-particles:
  hide-own: true

# Chat messages that also play a sound (sounds.yml: tpa-request, pay-received) - for players with Notification Sounds on and the matching alert (Teleport / Pay Alerts) on.
sound-triggers:
  tpa-request:
    - '^.* wants to .*/tpaccept or /tpadeny.*'
  pay-received:
    - '^\S+ sent you [$\d].*'

alert-filters:
  TELEPORT_ALERTS:
    - '^.* wants to .*/tpaccept or /tpadeny.*'
  PAY_ALERTS:
    - '^\S+ sent you [$\d].*'
  AUCTION_NOTIFICATIONS:
    - '.* bought your listing #\d+ for .*'
  ORDER_NOTIFICATIONS:
    - '^Order #\d+ fulfilled.*'

# Team chat: /teamchat <message> (or /tc) writes to your team only; /teamchat alone switches team chat mode on or off. A team member who turned "Team Chat Visibility" off in /settings does not see it.
teamchat:
  # every team message is written to logs/team-chat.log; admins read it live with the Team Chat Spy switch (/settings page 2, /chat menu, /teamspy) or /teamspy log [team]
  spy: true            # false = the spy switch is gone
  log: true
  format: '&b[Team] &f{player}&7: &f{message}'      # {player} {team} {message}
  enabled: '&7Team chat is on: everything you type goes to your team. Type &f/teamchat &7to switch it off.'
  disabled: '&7Team chat is off: you are back in the public chat.'
  no-team: '&cYou are not in a team. Create one with /team create <name>.'
  not-allowed: '&cYou can''t use team chat.'                 # the team leader can switch CHAT off for a member in /team settings

# Clear lag: dropped items are removed every few minutes, with a countdown in chat (a player can hide those messages: /settings -> Clear Entities Messages). /clearlag removes everything at once.
clearlag:
  enabled: true
  every-minutes: 5
  show-countdown: false                            # true = the countdown shows in chat before each cleanup (the cleanup itself always runs); players can hide it in /settings
  show-result: false                               # true = chat says how many entities were cleared
  warn-seconds: [60, 30, 10, 5, 4, 3, 2, 1]        # the countdown shows at these seconds before a cleanup (show-countdown)
  dropped-items: true
  min-item-age-seconds: 60                         # an item younger than this stays, so what was just dropped is not wiped
  animals: false
  monsters: false
  excluded-worlds: [duels]
  exclude-death-drops: true                        # the loot of a player who died is never cleared: it stays until the game's own despawn (5 minutes)
  exclude-named: true                              # named items and mobs stay
  exclude-tamed: true
  exclude-villagers: true
  excluded-entity-types: []                        # e.g. ALLAY, IRON_GOLEM
  excluded-item-materials: []                      # e.g. NETHERITE_INGOT, ELYTRA
  messages:
    countdown: '&7Clearing dropped items in &b{seconds}s&7...'
    success: '&7Cleared &b{total} &7dropped items and entities.'

# Cuboid binds that protect an area (bind types: spawn, afk, shard, rtp-zone, rtp-queue).
zone-protection:
  build: [spawn, rtp-zone, rtp-queue, shard]       # no placing or breaking blocks
  drop: [spawn, afk, rtp-zone, rtp-queue, shard]   # no dropping items
  pvp: [spawn, rtp-zone, rtp-queue, shard]         # no PvP (cuboid.pvp-disabled: true switches PvP off inside every cuboid)

# Randomized Coords (/settings): while on, the coordinates DonutREP shows a player (scoreboard {coords}, the location after /rtp) are shifted by a random
# X / Z offset that is new at every login. Turning it on or off kicks the player so the next login starts clean.
randomized-coords:
  kick-on-toggle: true
  min-offset: 1000
  max-offset: 50000

# Teleport points of the afk and spawn cuboids (/setafk <cuboid>, /setspawn <cuboid>, /afkmenu, /spawnmenu).
areas:
  max-points: 20            # at most this many teleport points for one cuboid
  point-mode: random        # random = a player lands on a random point of the cuboid | order = one point after the other (a cuboid can change it in /afkmenu)
  show-names: false         # true = the /afk and /spawn menus show the name of the cuboid instead of AFK #1, Spawn #1

# Staff tools for new players and for tailing a suspect.
newplayers:
  enabled: true             # /newplayers and the new-player notices
  hours: 2                  # a player is new for this many hours after the first join
  notify-staff: true        # a chat line for staff (donutrep.staff.newplayers) when somebody joins for the first time
recent:
  enabled: true             # /recent: the last players you teleported to, live
  size: 5                   # how many (1-9); the oldest drops off when a new one is added
watch:
  enabled: true             # /watch <player>: an alert when they teleport
  spectate: true            # /watch also puts you in spectator mode on them (stop = your old game mode back)
  auto-follow: true         # after they teleport a spectating staff member is put on them again, across worlds too
  min-distance: 8           # a teleport shorter than this many blocks is not reported

