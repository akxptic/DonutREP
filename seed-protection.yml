# Seed protection: makes it harder to find out your world seed (seed cracking).
#
# The server sends every player a "hashed seed" when they join and respawn. Seed crackers read it. With fake-hashed-seed on, each player is sent a fake value
# instead - different for every player and changed every rotate-minutes. The real seed never leaves the server.
# This does not hide the seed for somebody who walks to many structures and writes the coordinates down: also do what plugins/DonutREP/text/seed-protection-guide.txt says
# (random structure seeds, anti-xray). The console tells you what is still open when the server starts.
seed-protection:
  enabled: true
  fake-hashed-seed: true
  rotate-minutes: 30        # a player's fake value changes this often (0 = it never changes while the server runs)
  salt: '0e9f269cef7fac3773a74ea3e10d8119cdd8a9e7667a16d5'
  anti-xray: true           # true = DonutREP switches Paper's anti-xray on in config/paper-world-defaults.yml when it is off (a backup is kept; restart once). It hides ores from x-ray users and from seed crackers.
  anti-xray-engine-mode: 2  # 1 = ores are replaced by stone (lighter), 2 = fake ores are mixed in (hides more, a bit heavier)
  startup-check: true       # false = no warning block in the console

