# Sounds DonutREP+ plays. Each value is  sound|volume|pitch  (sound names like entity.player.levelup). Blank = no sound.
# sounds.enabled: false silences all of them. A player can switch the notification ones off in /settings -> Notification Sounds. Sounds inside the original plugin's own code (and the amethyst tools: amethyst-tools.yml) are separate.
sounds:
  enabled: true
  menu-click: ''                                          # played when any button in a DonutREP menu is clicked, e.g. ui.button.click|0.5|1.0
  shop-success: 'entity.experience_orb.pickup|1.0|1.0'
  shop-error: 'entity.villager.no|1.0|1.0'
  crate-claim: 'entity.player.levelup|0.8|1.2'
  key-all: 'entity.player.levelup|1.0|1.2'
  rules-accept: 'entity.player.levelup|1.0|1.2'
  friend-request: 'entity.experience_orb.pickup|1.0|1.4'
  friend-follow: 'entity.experience_orb.pickup|1.0|1.2'
  tpa-request: 'block.note_block.pling|1.0|1.4'            # somebody sent you /tpa or /tpahere
  pay-received: 'entity.experience_orb.pickup|1.0|1.0'    # somebody paid you
  enderchest-open: 'block.ender_chest.open|1.0|1.0'
  enderchest-close: 'block.ender_chest.close|1.0|1.0'

