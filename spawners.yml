# Spawner config. TYPES at the bottom lists each spawner kind with its loot table and icon.
SETTINGS:
  ENABLED: true
  # Choose ONE mode - set one of the next two to true and the other to false:
  STORAGE_SPAWNERS: true      # true = no mobs; each spawner fills a storage menu with loot (filter, sell all, collect all, drop loot)
  MOB_SPAWNERS: false         # true = spawners spawn real mobs like vanilla, with no menu or storage
  # true = /spawner without arguments lists the spawners you placed (world, coords, type, amount); click one to open it.
  SPAWNER_LIST_COMMAND: false
  # If both modes are true or both false you get an error and storage mode is used.
  ACCESS_MODE: PUBLIC
  ALLOW_SPAWNER_STEAL: true
  ALLOW_STEALING: true
  GENERATION_INTERVAL_SECONDS: 5
  PROCESS_ONLY_LOADED_CHUNKS: true
  REQUIRE_PLAYER_NEARBY: false
  PLAYER_NEARBY_RADIUS: 16
  MAX_STACK_PER_BLOCK: 100000
  STORAGE_CAP_PER_LOOT_KEY: 1000000
  DROP_ON_BREAK_IF_INVENTORY_FULL: true
  REQUIRE_SILK_TOUCH: true
  CANCEL_MOB_SPAWN: true
  SHOW_STACK_ON_LOOK: true     # shows the stack size above the hotbar while you look at a spawner (6 blocks)
  DROP_MODE: THROW             # Drop-loot button. THROW = items fly out of you in the direction you face (land 1-2 blocks ahead). PLACE = they appear in front of the spawner (see DROP_MAX_DISTANCE)
  DROP_THROW_SPEED: 0.35       # THROW: toss strength (0.35 normal, higher = further)
  DROP_THROW_HEIGHT: 1.2       # THROW: height above your feet the items start at (1.2 = chest)
  DROP_PICKUP_DELAY_TICKS: 10  # ticks before dropped loot can be picked up (20 = 1 second, 10 = vanilla)
  DROP_MAX_DISTANCE: 2         # PLACE only: how many blocks in front of the spawner (on your side) the loot appears (0 = at your feet)
  STORAGE_MAX_DISTANCE: 6      # distance in blocks; walk further than this and the open storage closes (0 = unlimited)
  # Mob mode (MOB_SPAWNERS: true): stacking still works (right-click with the same spawner, sneak to add 64) and every extra spawner adds one mob per spawn.
  MOB_STACK_MULTIPLIER: true
  MOB_STACK_MAX_EXTRA: 15      # cap on the extra mobs one spawn can add
  XP_ENABLED: false
# Spawner shop (/spawners shop and the Buy button of /spawners). CURRENCY: SHARD = Donut Shards, MONEY = Vault money.
SHOP:
  ENABLED: true
  CURRENCY: SHARD
  DEFAULT_PRICE: 1500          # price for any type not listed below (0 = not sold)
  PRICES: {}                   # per-type prices, e.g.  PIG: 1000  ZOMBIE: 2500  IRON_GOLEM: 10000
