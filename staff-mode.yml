# Staff mode hotbar (/staffmode). slot is 0-8; material is any item.
staff-mode:
  tools:
    vanish:     { slot: 0, material: LIME_DYE, material-off: GRAY_DYE }
    freeze:     { slot: 1, material: ICE }
    stafflist:  { slot: 4, material: CLOCK }
    betterview: { slot: 7, material: ORANGE_CARPET }
    randomtp:   { slot: 8, material: PLAYER_HEAD }

