# The header and footer of the tab list (the key that shows the player list).
# Placeholders: %online% (players online), %max%, %player%, %economy_ping% (the ping in ms).
# Colours: &a ... and &#rrggbb. A gradient: <#00ACFB>&lText</#00FBFB>.
tablist:
  enabled: true
  update-seconds: 2
  header:
    - ''
    - '<#00ACFB>&lCosmic SMP</#00FBFB>'
    - '&r&7Online players: &f%online%'
    - ''
  footer:
    - ''
    - '   &#36BEF8/discord /store   '
    - '&7Ping &7&#0068D5%economy_ping%&7'
    - ''

