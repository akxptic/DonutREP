# Team options (the team menu, /team). Edit freely, then /donutrep reload.
# Everything the leader can change is OFF by default; the leaderboards are on.
teams:
  rename: false          # the leader can rename the team (team settings menu, /team rename <name>)
  color:
    enabled: false       # the leader picks a team color (team settings menu, /team color <color>); the scoreboard team line uses it
  icons: false           # the leader picks an icon for the team (like homes); shown in the team menu and in the list of all teams
  allies:
    enabled: false       # /team ally <team>: two teams that agree cannot hurt each other (like teammates)
    max: 3               # how many allies one team can have
  leaderboards: true     # /teamtop: most kills, deaths, playtime, money and shards by team
  leaderboard-cache-seconds: 60
  leaderboard-size: 10   # how many teams the board shows

